<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU 占用看板</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-6xl mx-auto p-6" x-data="board()" x-init="load(); setInterval(load, 30000)">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">GPU 占用看板</h1>
    <div class="text-sm text-gray-500">
      <a href="/stats" class="text-blue-600 hover:underline mr-4">历史统计 →</a>
      <a href="/admin" class="text-blue-600 hover:underline mr-4">管理 →</a>
      更新于 <span x-text="updatedAt"></span>
    </div>
  </div>

  <div class="flex gap-4 text-sm mb-4">
    <span><i class="inline-block w-3 h-3 rounded bg-blue-500"></i> 被占用</span>
    <span><i class="inline-block w-3 h-3 rounded bg-green-500"></i> 空闲</span>
    <span class="text-gray-400">实际行: 颜色深浅=利用率, 灰=无采集数据</span>
  </div>

  <template x-for="m in machines" :key="m.machine">
    <div class="bg-white rounded-lg shadow p-5 mb-5">
      <div class="flex items-baseline gap-3 mb-3">
        <h2 class="text-lg font-semibold" x-text="m.machine"></h2>
        <span class="text-sm text-gray-500" x-text="`${m.cluster} / ${m.node}`"></span>
        <span class="text-sm font-medium"
              :class="m.free > 0 ? 'text-green-600' : 'text-red-600'"
              x-text="`空闲 ${m.free}/${m.total_gpus}`"></span>
      </div>

      <!-- 申请: 谁占了几卡, 按数量合并成块 -->
      <div class="text-xs text-gray-400 mb-1">申请</div>
      <div class="grid gap-2 mb-4" :style="`grid-template-columns: repeat(${m.total_gpus}, minmax(0,1fr))`">
        <template x-for="c in m.claims" :key="c.user + c.end_at">
          <div class="rounded-lg p-3 text-white text-xs bg-blue-500 cursor-default"
               :style="`grid-column: span ${c.count}`"
               :title="`${c.user} ${c.count}卡 至 ${fmt(c.end_at)}`">
            <div class="font-bold text-sm" x-text="`${c.count}卡`"></div>
            <div x-text="c.user"></div>
            <div x-text="`至 ${fmt(c.end_at)}`"></div>
          </div>
        </template>
        <div x-show="m.free > 0" class="rounded-lg p-3 text-xs bg-green-500 text-white"
             :style="`grid-column: span ${m.free}`">
          <div class="font-bold text-sm" x-text="`${m.free}卡`"></div>
          <div class="opacity-80">空闲</div>
        </div>
      </div>

      <!-- 实际: 每卡利用率, 不区分人 -->
      <div class="text-xs text-gray-400 mb-1">实际</div>
      <div class="grid gap-2" :style="`grid-template-columns: repeat(${m.total_gpus}, minmax(0,1fr))`">
        <template x-if="!m.collected">
          <div class="rounded-lg p-2 text-xs bg-gray-300 text-gray-600 text-center"
               :style="`grid-column: span ${m.total_gpus}`">无采集数据</div>
        </template>
        <template x-for="a in m.actual" :key="a.index">
          <div class="rounded-lg p-2 text-xs text-white text-center cursor-default"
               :class="utilColor(a)"
               :title="`卡${a.index}${a.util != null ? ' 利用率 ' + a.util + '%' : ''}${a.mem ? ' 显存 ' + a.mem + 'MB' : ''}${a.stale ? ' (数据过期)' : ''}`">
            <span x-text="a.util != null ? a.util + '%' : (a.allocated ? '占用' : '-')"></span>
          </div>
        </template>
      </div>
      <div class="text-xs text-gray-400 mt-2" x-show="m.node_level_occupied > 0"
           x-text="`另有 ${m.node_level_occupied} 卡节点级占用(无卡号信息)`"></div>
    </div>
  </template>

  <div x-show="machines.length === 0" class="text-gray-500 text-center py-20">
    暂无机器, 先通过 POST /api/machines 登记
  </div>
</div>

<script>
function board() {
  return {
    machines: [],
    updatedAt: '-',
    async load() {
      try {
        const r = await fetch('/api/status');
        this.machines = await r.json();
        this.updatedAt = new Date().toLocaleTimeString();
      } catch (e) { console.error(e); }
    },
    utilColor(a) {
      if (a.stale) return 'bg-gray-400';
      if (!a.allocated) return 'bg-gray-300';
      const u = a.util == null ? 50 : a.util;
      if (u >= 80) return 'bg-red-500';
      if (u >= 40) return 'bg-orange-400';
      if (u > 0) return 'bg-yellow-400';
      return 'bg-lime-400';
    },
    fmt(iso) {
      const d = new Date(iso + 'Z');
      return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    },
  };
}
</script>
</body>
</html>
