apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gpu-booking-data
  labels:
    app.kubernetes.io/name: gpu-booking
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-booking
  labels:
    app.kubernetes.io/name: gpu-booking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-booking
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-booking
    spec:
      containers:
        - name: gpu-booking
          image: gpu-booking:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: FEISHU_APP_ID
              valueFrom:
                secretKeyRef:
                  name: gpu-booking-feishu
                  key: app-id
            - name: FEISHU_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: gpu-booking-feishu
                  key: app-secret
            - name: FEISHU_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gpu-booking-feishu
                  key: verify-token
                  optional: true
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gpu-booking-data
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-booking
  labels:
    app.kubernetes.io/name: gpu-booking
spec:
  selector:
    app.kubernetes.io/name: gpu-booking
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
